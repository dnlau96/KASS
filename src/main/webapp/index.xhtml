<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="es">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KASS - Point of Sale</title>
    <h:outputStylesheet library="css" name="style.css" />
    
    <script type="text/javascript">
        function handleScanComplete(args) {
            if (args.productFound) {
                if (args.showCustomerDialog) {
                    // Es el primer producto, abre el diálogo de NIT
                    PF('customerDialogWidget').show();
                } else {
                    // No es el primer producto, abre el diálogo de confirmación normal
                    PF('confirmDialogWidget').show();
                }
            }
            // Si productFound es false, no hace nada (el bean mostrará el error)
        }
    </script>
</h:head>
<h:body>
    <p:growl id="messages" showDetail="true" />
    
    <header class="app-header">
        <div class="header-left">
            <div class="logo-container" ondblclick="PF('adminLoginDialogWidget').show()">
                <h:graphicImage library="img" name="KASS_icone.png" alt="KASS Logo"/>
            </div>
        </div>
        <div class="header-right">
            <p:commandButton value="Identificar Cliente" icon="pi pi-user-edit" 
                             oncomplete="PF('customerDialogWidget').show()" process="@this"
                             styleClass="header-button" />
            <p:outputPanel id="customerInfoPanel" styleClass="customer-info">
                <strong>Cliente:</strong>
                <h:outputText value=" #{posBean.currentCustomer.name} (NIT: #{posBean.currentCustomer.nit})" />
            </p:outputPanel>
        </div>
    </header>

    <main class="main-content">
        <h:form id="mainForm">
            <p:outputPanel id="totalPanel">
                 <div class="total-display">
                     <h:outputText value="#{posBean.totalAmount}">
                         <f:convertNumber type="currency" currencySymbol="Q "/>
                     </h:outputText>
                 </div>
            </p:outputPanel>

            <h:panelGroup id="cartSection" layout="block">
                <div class="content-card" rendered="#{not empty posBean.shoppingCart}">
                    <p:dataTable id="cartTable" var="item" value="#{posBean.shoppingCart}" emptyMessage="No products in cart." rows="5" paginator="true">
                        <p:column headerText="Product"><h:outputText value="#{item.product.name}" /></p:column>
                        <p:column headerText="Quantity" style="text-align:center"><h:outputText value="#{item.quantity}" /></p:column>
                        <p:column headerText="Unit Price" style="text-align:right"><h:outputText value="#{item.product.salePrice}"><f:convertNumber type="currency" currencySymbol="Q"/></h:outputText></p:column>
                        <p:column headerText="Subtotal" style="text-align:right"><h:outputText value="#{item.subtotal}"><f:convertNumber type="currency" currencySymbol="Q"/></h:outputText></p:column>
                        <p:column style="width:50px; text-align:center;">
                            <p:commandButton icon="pi pi-times" styleClass="ui-button-danger rounded-button"
                                             actionListener="#{posBean.selectItemForRemoval(item)}"
                                             oncomplete="PF('authorizationDialogWidget').show()"
                                             process="@this"
                                             update=":authorizationForm">
                                <f:setPropertyActionListener target="#{posBean.itemToRemove}" value="#{item}" />
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:panelGroup>

            <p:outputPanel id="actionsPanelWrapper">
                <div class="content-card" style="#{not empty posBean.shoppingCart ? 'border-top: none; border-top-left-radius: 0; border-top-right-radius: 0;' : ''}">
                    <div class="actions-panel">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <p:outputLabel for="barcode" value="Scan Product:" style="font-weight:bold;"/>
                            <p:inputText id="barcode" value="#{posBean.barcode}" placeholder="Enter barcode" maxlength="13">
                                <p:ajax event="keyup" listener="#{posBean.findProductByBarcode}"
                                        update=":mainForm:confirmDialog" 
                                        oncomplete="handleScanComplete(args)"/>
                            </p:inputText>
                            <p:commandButton value="Search Product" icon="pi pi-search" 
                                             actionListener="#{posBean.clearSearchResults}"
                                             oncomplete="PF('searchDialogWidget').show()"
                                             update=":mainForm:searchDialogContent"
                                             process="@this"/>
                        </div>
                        <p:commandButton value="Pay" actionListener="#{posBean.checkout}"
                            update="@form :customerInfoPanel :messages" 
                            styleClass="ui-button-success"
                              icon="pi pi-check-circle" rendered="#{not empty posBean.shoppingCart}"/>
                    </div>
                </div>
            </p:outputPanel> 

            <p:dialog header="Confirmar Producto" widgetVar="confirmDialogWidget" modal="true" id="confirmDialog" 
                      closable="false" resizable="false"
                      onShow="PF('confirmButtonWidget').jq.focus()">
                <p:outputPanel rendered="#{not empty posBean.foundProduct}">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h:outputText value="¿Desea agregar este producto?" style="font-size: 1.2em;"/>
                    </div>
                    <h:panelGrid columns="2" styleClass="dialog-grid">
                        <h:outputText value="Producto:" style="font-weight:bold;"/> <h:outputText value="#{posBean.foundProduct.name}" />
                        <h:outputText value="Precio:" style="font-weight:bold;"/> <h:outputText value="#{posBean.foundProduct.salePrice}"><f:convertNumber type="currency" currencySymbol="Q"/></h:outputText>
                    </h:panelGrid>
                    <br/>
                    <div style="display: flex; justify-content: space-around; gap: 10px;">
                        <p:commandButton value="Confirmar (Enter)" icon="pi pi-check"
                                         widgetVar="confirmButtonWidget"
                                         actionListener="#{posBean.addProductToSale}"
                                         oncomplete="PF('confirmDialogWidget').hide();"
                                         update=":mainForm:cartSection :mainForm:totalPanel :mainForm:barcode :messages :mainForm:actionsPanelWrapper"
                                         styleClass="ui-button-success"/>
                        <p:commandButton value="Cancelar (Esc)" icon="pi pi-times"
                                         actionListener="#{posBean.cancelAddProduct}"
                                         oncomplete="PF('confirmDialogWidget').hide();"
                                         update=":mainForm:barcode"
                                         styleClass="ui-button-danger"/>
                    </div>
                    <p:hotkey bind="return" actionListener="#{posBean.addProductToSale}" 
                              oncomplete="PF('confirmDialogWidget').hide();"
                              update=":mainForm:cartSection :mainForm:totalPanel :mainForm:barcode :messages :mainForm:actionsPanelWrapper" />
                    <p:hotkey bind="esc" actionListener="#{posBean.cancelAddProduct}" 
                              oncomplete="PF('confirmDialogWidget').hide();"
                              update=":mainForm:barcode" />
                </p:outputPanel>
            </p:dialog>
            
            <p:dialog header="Search Product" widgetVar="searchDialogWidget" modal="true" width="650">
                <p:outputPanel id="searchDialogContent">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                        <p:outputLabel for="searchTerm" value="Product name:"/>
                        <p:inputText id="searchTerm" value="#{posBean.searchTerm}" style="flex-grow: 1;"/>
                        <p:commandButton value="Search" actionListener="#{posBean.performSearch}" update=":mainForm:searchResultsTable"/>
                    </div>
                    <div class="alphabet-filter" style="margin-bottom: 15px; text-align: center;">
                        <ui:repeat value="#{posBean.alphabet}" var="letter">
                            <p:commandButton value="#{letter}" actionListener="#{posBean.filterByFirstLetter(letter)}" 
                                             update=":mainForm:searchResultsTable" style="margin: 2px; width: 35px;"/>
                        </ui:repeat>
                    </div>
                    <p:dataTable id="searchResultsTable" var="result" value="#{posBean.searchResults}" 
                                 emptyMessage="No products found." scrollable="true" scrollHeight="250">
                        <p:column headerText="Name" style="width: 60%;"><h:outputText value="#{result.name}"/></p:column>
                        <p:column headerText="Price" style="width: 20%; text-align:right;"><h:outputText value="#{result.salePrice}"><f:convertNumber type="currency" currencySymbol="Q "/></h:outputText></p:column>
                        <p:column style="width: 20%; text-align:center;"><p:commandButton value="Add" actionListener="#{posBean.addProductFromSearch(result)}" 
                                             update=":mainForm:cartSection :mainForm:totalPanel :messages :mainForm:actionsPanelWrapper" 
                                             oncomplete="PF('searchDialogWidget').hide()"/></p:column>
                    </p:dataTable>
                </p:outputPanel>
            </p:dialog>
        </h:form> </main>

    <p:dialog header="Admin Access" widgetVar="adminLoginDialogWidget" modal="true"
              width="350" responsive="true">
        <h:form>
             <p:panelGrid columns="2" styleClass="dialog-grid">
                <p:outputLabel for="adminUser" value="Username:"/>
                <p:inputText id="adminUser" value="#{adminBean.username}" required="true" style="width: 100%"/>
                
                <p:outputLabel for="adminPass" value="Password:"/>
                <p:password id="adminPass" value="#{adminBean.password}" required="true" style="width: 100%"/>
            </p:panelGrid>
            
            <div style="text-align: center; margin-top: 20px;">
                <p:commandButton value="Login" action="#{adminBean.login}" update=":messages"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog header="Identify Customer" widgetVar="customerDialogWidget" modal="true"
              width="350" responsive="true">
        <h:form>
            <p:panelGrid columns="2" styleClass="dialog-grid">
                <p:outputLabel for="nit" value="NIT:"/>
                <p:inputText id="nit" value="#{posBean.customerNit}" required="true" style="width: 100%"/>
                
                <p:outputLabel for="name" value="Nombre:"/>
                <p:inputText id="name" value="#{posBean.customerName}" required="true" style="width: 100%"/>
            </p:panelGrid>
            
            <div style="text-align: center; margin-top: 20px;">
                <p:commandButton value="Save Customer" actionListener="#{posBean.registerCustomer}" 
                                 update=":customerInfoPanel :messages :mainForm:cartSection :mainForm:totalPanel :mainForm:actionsPanelWrapper"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog header="Autorización Requerida" widgetVar="authorizationDialogWidget" modal="true"
              closable="false" resizable="false" width="350">
        <h:form id="authorizationForm">
            <p:remoteCommand name="updateAuthPanel" update="authPanel" process="@this" />
            
            <div style="text-align: center; margin-bottom: 15px;">
                <h:outputText value="Un supervisor debe escanear su gafete para quitar el producto." />
            </div>
            <p:outputPanel id="authPanel">
                <p:outputPanel rendered="#{not empty posBean.itemToRemove}">
                    <h:panelGrid columns="2" styleClass="dialog-grid">
                        <h:outputText value="Producto:" style="font-weight:bold;"/>
                        <h:outputText value="#{posBean.itemToRemove.product.name}"/>
                        <h:outputText value="Cantidad:" style="font-weight:bold;"/>
                        <h:outputText value="#{posBean.itemToRemove.quantity}"/>
                    </h:panelGrid>
                </p:outputPanel>
            </p:outputPanel>
            <hr/>
            <h:panelGrid columns="1" style="width:100%; margin-top: 15px;">
                <p:outputLabel for="authCode" value="Escanear Código de Supervisor:"/>
                <p:password id="authCode" value="#{posBean.authorizationCode}" required="true" style="width:100%;" />
                <p:commandButton value="Autorizar" icon="pi pi-check-circle" 
                                 actionListener="#{posBean.authorizeAndRemoveItem}"
                                 update=":messages :authorizationForm:authPanel :mainForm:cartSection :mainForm:totalPanel"
                                 styleClass="ui-button-success" style="margin-top:10px;"/>
            </h:panelGrid>
        </h:form>
    </p:dialog>
    
</h:body>
</html>
