<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Punto de Venta Supermercado</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 350px;
            text-align: center;
        }
        
        .logo {
            margin-bottom: 20px;
        }
        
        .logo img {
            max-width: 150px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 25px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #7f8c8d;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2ecc71;
        }
        
        .footer {
            margin-top: 20px;
            color: #95a5a6;
            font-size: 12px;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <!-- Reemplaza con el logo de tu supermercado -->
            <img src="https://via.placeholder.com/150x50?text=Supermercado+Logo" alt="Logo Supermercado">
        </div>
        
        <h1>Acceso al Punto de Venta</h1>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required>
                <div class="error-message" id="username-error"></div>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
                <div class="error-message" id="password-error"></div>
            </div>
            
            <button type="submit">Ingresar</button>
        </form>
        
        <div class="footer">
            Sistema de Punto de Venta v1.0 © 2023
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validación simple (puedes mejorarla según tus necesidades)
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            let isValid = true;
            
            // Limpiar mensajes de error
            document.getElementById('username-error').style.display = 'none';
            document.getElementById('password-error').style.display = 'none';
            
            if(username.trim() === '') {
                document.getElementById('username-error').textContent = 'Por favor ingrese su usuario';
                document.getElementById('username-error').style.display = 'block';
                isValid = false;
            }
            
            if(password.trim() === '') {
                document.getElementById('password-error').textContent = 'Por favor ingrese su contraseña';
                document.getElementById('password-error').style.display = 'block';
                isValid = false;
            }
            
            if(isValid) {
                // Aquí iría la lógica para autenticar al usuario
                alert('Login exitoso! Redirigiendo al sistema...');
                // window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
