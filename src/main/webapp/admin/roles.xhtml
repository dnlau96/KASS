<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>KASS - Role Management</title>
    <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
    <div class="admin-header">
        <h1><i class="pi pi-shield" style="margin-right: 10px;"></i>Role Management</h1>
        <h:form>
            <p:commandButton value="Back to Dashboard" action="dashboard.xhtml?faces-redirect=true" icon="pi pi-arrow-left"/>
            <p:commandButton value="Logout" action="#{adminBean.logout}" icon="pi pi-sign-out" style="margin-left: 10px;"/>
        </h:form>
    </div>

    <div class="admin-container">
        <h:form id="form">
            <p:growl id="messages" showDetail="true"/>
            <div class="admin-card">
                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton value="New Role" icon="pi pi-plus" 
                                         actionListener="#{roleBean.openNew}"
                                         update=":form:manage-role-content" 
                                         oncomplete="PF('roleDialogWidget').show()"
                                         process="@this"/>
                    </p:toolbarGroup>
                </p:toolbar>
                
                <p:dataTable id="dt-roles" var="role" value="#{roleBean.roleList}"
                             emptyMessage="No roles found." paginator="true" rows="10">
                    <p:column headerText="Role Name" sortBy="#{role.roleName}">
                        <h:outputText value="#{role.roleName}" />
                    </p:column>
                    <p:column headerText="Description">
                        <h:outputText value="#{role.description}" />
                    </p:column>
                    <p:column headerText="Actions" style="width:7rem;text-align:center">
                        <p:commandButton icon="pi pi-pencil" update=":form:manage-role-content"
                                         oncomplete="PF('roleDialogWidget').show()" 
                                         styleClass="edit-button rounded-button ui-button-success" 
                                         process="@this">
                            <f:setPropertyActionListener value="#{role}" target="#{roleBean.selectedRole}" />
                        </p:commandButton>
                        <p:commandButton class="ui-button-warning rounded-button" icon="pi pi-trash"
                                         process="@this"
                                         oncomplete="PF('deleteRoleDialog').show()">
                            <f:setPropertyActionListener value="#{role}" target="#{roleBean.selectedRole}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>

            <h:panelGroup id="dialogs">
                <p:dialog header="Role Details" showEffect="fade" modal="true" 
                          widgetVar="roleDialogWidget" responsive="true">
                    
                    <p:outputPanel id="manage-role-content" class="ui-fluid">
                        <p:outputPanel rendered="#{not empty roleBean.selectedRole}">
                            <div class="p-field">
                                <p:outputLabel for="roleName">Role Name</p:outputLabel>
                                <p:inputText id="roleName" value="#{roleBean.selectedRole.roleName}" required="true" placeholder="e.g., ADMIN"/>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="description">Description</p:outputLabel>
                                <p:inputText id="description" value="#{roleBean.selectedRole.description}" placeholder="e.g., Can access all modules"/>
                            </div>
                        </p:outputPanel>
                    </p:outputPanel>
                    
                    <f:facet name="footer">
                        <p:commandButton value="Save" icon="pi pi-check" 
                                         actionListener="#{roleBean.saveRole}"
                                         update="manage-role-content :form:messages :form:dt-roles" 
                                         process="manage-role-content @this" />
                        <p:commandButton value="Cancel" icon="pi pi-times" 
                                         onclick="PF('roleDialogWidget').hide()" class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>

                <p:confirmDialog widgetVar="deleteRoleDialog" showEffect="fade" width="300"
                                 message="Are you sure you want to delete this role?" 
                                 header="Confirm" severity="warn">
                    
                    <p:commandButton value="Yes" icon="pi pi-check" 
                                     actionListener="#{roleBean.deleteRole}"
                                     update=":form:dt-roles :form:messages"
                                     oncomplete="PF('deleteRoleDialog').hide()" />
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" 
                                     icon="pi pi-times" onclick="PF('deleteRoleDialog').hide()" />
                </p:confirmDialog>
            </h:panelGroup>
            
        </h:form> </div>
</h:body>
</html>
