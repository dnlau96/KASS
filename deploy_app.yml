---
- name: Configurar Instancia y Desplegar KASS2
  hosts: kass_server  
  become: yes
  tasks:
    - name: Crear directorio de la aplicación
      file:
        path: /home/ubuntu/kass_app
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copiar archivos de configuración (Sin SRC ni POM)
      copy:
        src: "{{ item }}" 
        dest: /home/ubuntu/kass_app/
      loop:
        - docker-compose.yml
        - Dockerfile
        - entrypoint.sh
        - setup.asadmin

    - name: Enviar el WAR ya compilado
      copy:
        src: target/KASS2.war
        dest: /home/ubuntu/kass_app/KASS2.war

    - name: Levantar la infraestructura (Sin reconstruir dependencias)
      shell: docker-compose up -d
      args:
        chdir: /home/ubuntu/kass_app/